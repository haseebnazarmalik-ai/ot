<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OT Tracker Pro - App Moved</title>
    <style>
        :root { --primary: #1e3a8a; --gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            background: var(--gradient);
            color: #334155;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.97);
            border-radius: 28px;
            padding: 40px 28px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }
        .icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            color: white;
        }
        h1 {
            font-size: 20px;
            color: var(--primary);
            margin: 0 0 12px 0;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #64748b;
            margin: 0 0 24px 0;
        }
        .note {
            font-size: 12px;
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 24px;
            color: #1e40af;
            font-weight: 600;
        }
        a.btn {
            display: block;
            text-decoration: none;
            background: var(--gradient);
            color: white;
            font-weight: 800;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(30,58,138,0.3);
        }
        .url {
            margin-top: 16px;
            font-size: 11px;
            color: #94a3b8;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⏳</div>
        <h1>OT Tracker Pro Has Moved</h1>
        <p>This app is no longer available here. It has permanently moved to a new address, and your data is safe.</p>
        <div class="note">Sign in with the same Google account you used before — all your saved data will be there.</div>
        <a class="btn" href="https://docutoolbox.com/overtime-calculator/">Go to the New App</a>
        <div class="url">https://docutoolbox.com/overtime-calculator/</div>
    </div>
</body>
</html>
